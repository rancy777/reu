    transports: ["stdio", "http"]
    capabilities: ["pe.runtime", "pe.memory", "dotnet.runtime", "session.observe"]
    notes:
      - "Public documentation exposes live user-mode, kernel, crash-dump and TTD workflows."
      - "Verify DbgEng installation and x86 worker availability when 32-bit/.NET SOS analysis matters."
      - "Use loopback or authenticated remote transport; do not expose a debugger listener directly to an untrusted network."

  - id: "ghidra.lauriewired"
