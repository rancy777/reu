schema_version: "1.0"
catalog_generated: "2026-10-16"
policy:
  purpose: "Reference and bind to existing upstream MCP implementations; do not vendor third-party servers into the Skill."
  upstream_installation: "user-approved only"
  pinning: "For reproducible cases, pin release/tag/commit and record native tool version separately."
  verification: "Run provider health check and MCP schema discovery after installation and after upgrades."
  default_transport: "stdio when available; otherwise loopback-only HTTP/Streamable HTTP with authentication."
  duplicate_provider_rule: "Do not enable multiple providers for the same native GUI simultaneously unless a comparison/regression test requires it."

providers:

  - id: "ida.hexrays.official"
    native_tool: "IDA Pro"
    provider_class: "official"
    trust_tier: "S"
    status: "recommended"
    repository: "https://github.com/HexRaysSA/ida-mcp"
    documentation: "https://docs.hex-rays.com/core/mcp"
    observed_release: "v20261008.0.1"
    observed_requirements: "IDA >= 9.4; idalib; Python >= 3.11"
    transports: ["stdio", "streamable-http"]
    capabilities: ["pe.static", "dotnet.metadata", "dotnet.runtime", "android.native", "native.elf", "decompiler", "session.observe", "evidence.raw"]
    notes:
      - "Use the official Hex-Rays provider as the canonical IDA binding."
      - "The upstream project recommends disabling other IDA MCP servers to reduce agent confusion."
      - "Prefer headless mode for deterministic batch/regression work; GUI binding is useful when the analyst already has an IDB open."

  - id: "x64dbg.ouonet"
    native_tool: "x64dbg/x32dbg"
    provider_class: "community"
    trust_tier: "A-/candidate"
    status: "recommended-after-health-check"
    repository: "https://github.com/ouonet/x64dbg-mcp"
    observed_install: "npm install -g x64dbg-mcp; x64dbg-mcp setup; x64dbg-mcp doctor"
    transports: ["stdio", "streamable-http"]
    capabilities: ["pe.runtime", "pe.memory", "pe.reconstruct", "session.observe"]
    notes:
      - "Auto-detects PE architecture and can launch x32dbg or x64dbg."
      - "Verify the local bridge/plugin before use and keep the server local."
      - "Pin a tested npm/package version for regression cases."

  - id: "x64dbg.duty1g"
    native_tool: "x64dbg/x32dbg"
    provider_class: "community"
    trust_tier: "B-/security-review-required"
    status: "quarantined-by-default"
    repository: "https://github.com/duty1g/x64dbg-mcp-server"
    observed_release: "v1.0"
    capabilities: ["pe.runtime", "pe.memory", "pe.reconstruct", "session.observe"]
    notes:
      - "Public GitHub security page currently shows published advisories, including a critical unauthenticated network-control issue and a moderate Content-Length issue."
      - "Do not select automatically. Only use an explicitly reviewed/patched build in an isolated lab after verifying the advisory status."
      - "This entry is retained as a corpus candidate, not as the default provider."

  - id: "windbg.glslang"
    native_tool: "WinDbg/DbgEng"
    provider_class: "community"
