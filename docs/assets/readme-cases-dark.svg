<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="314" viewBox="0 0 1120 314" role="img" aria-labelledby="title desc">
<title id="title">Two measured VMProtect 3.8.4 x64 experiments</title>
<desc id="desc">Measured results for two separate owned C++ samples, recorded 2026-10-17. Packing reconstruction and one pure-function semantic recovery. Not general VMP coverage or a full-domain equivalence proof.</desc>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<rect x="1" y="1" width="548" height="312" rx="14" fill="#192332" stroke="#303a4d"/>
<text x="29" y="39" fill="#fe785c" font-size="17" font-weight="700">01 / PACKING &amp; RECONSTRUCTION</text><text x="29" y="101" fill="#edf2f8" font-size="42" font-weight="750">12.03 MiB → 5 KiB</text><text x="29" y="141" fill="#a4b0c1" font-size="19" font-weight="400">Protected image → standalone reconstructed EXE</text><path d="M29 165h492" stroke="#303a4d"/>
<text x="29" y="203" fill="#edf2f8" font-size="29" font-weight="700">45 / 45</text><text x="183" y="201" fill="#a4b0c1" font-size="20" font-weight="400">behavior checks passed</text><text x="29" y="238" fill="#edf2f8" font-size="29" font-weight="700">14 / 14</text><text x="183" y="236" fill="#a4b0c1" font-size="20" font-weight="400">structural checks passed</text><text x="29" y="283" fill="#a4b0c1" font-size="17" font-weight="400">Known OEP · 9 manual import-call repairs</text><rect x="571" y="1" width="548" height="312" rx="14" fill="#192332" stroke="#303a4d"/>
<text x="599" y="39" fill="#fe785c" font-size="17" font-weight="700">02 / FUNCTION VIRTUALIZATION</text><text x="599" y="101" fill="#edf2f8" font-size="54" font-weight="750">53</text><text x="690" y="99" fill="#edf2f8" font-size="22" font-weight="600">native x64 instructions</text><text x="599" y="141" fill="#a4b0c1" font-size="19" font-weight="400">Real VM trace → Triton → LLVM → native DLL</text><path d="M599 165h492" stroke="#303a4d"/>
<text x="599" y="203" fill="#edf2f8" font-size="29" font-weight="700">100,008</text><text x="753" y="201" fill="#a4b0c1" font-size="20" font-weight="400">input checks passed</text><text x="599" y="238" fill="#edf2f8" font-size="29" font-weight="700">128</text><text x="753" y="236" fill="#a4b0c1" font-size="20" font-weight="400">protected comparisons passed</text><text x="599" y="283" fill="#a4b0c1" font-size="17" font-weight="400">One pure function · CLI harness rebuilt separately</text>
</g>
