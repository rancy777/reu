<rect width="1600" height="900" fill="url(#bg)"/>
<g opacity=".12" stroke="#38bdf8"><path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600M0 700H1600M0 800H1600"/><path d="M100 0V900M300 0V900M500 0V900M700 0V900M900 0V900M1100 0V900M1300 0V900M1500 0V900"/></g>
<text x="80" y="70" fill="#e2e8f0" font-size="38" font-family="Inter,Arial,sans-serif" font-weight="700">Reverse Engineering &amp; Unpacking Agent — Architecture</text>
<text x="80" y="108" fill="#94a3b8" font-size="20" font-family="Inter,Arial,sans-serif">Tool-agnostic orchestration • MCP integration • evidence-driven learning</text>

