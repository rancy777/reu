  <rect x="70" y="190" width="250" height="125" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <rect x="350" y="190" width="250" height="125" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/>
