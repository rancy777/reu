  <rect x="1190" y="190" width="340" height="125" rx="18" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
</g>
<g font-family="Inter,Arial,sans-serif">
<text x="195" y="232" text-anchor="middle" fill="#7dd3fc" font-size="24" font-weight="700">Windows / PE</text><text x="195" y="268" text-anchor="middle" fill="#cbd5e1" font-size="17">EXE • DLL • Native • .NET</text>
<text x="475" y="232" text-anchor="middle" fill="#6ee7b7" font-size="24" font-weight="700">Android</text><text x="475" y="268" text-anchor="middle" fill="#cbd5e1" font-size="17">APK • AAB • DEX • SO</text>
<text x="755" y="232" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="700">Linux / ELF</text><text x="755" y="268" text-anchor="middle" fill="#cbd5e1" font-size="17">ELF • native runtimes</text>
<text x="1035" y="232" text-anchor="middle" fill="#93c5fd" font-size="24" font-weight="700">.NET</text><text x="1035" y="268" text-anchor="middle" fill="#cbd5e1" font-size="17">IL • R2R • NativeAOT</text>
<text x="1360" y="232" text-anchor="middle" fill="#67e8f9" font-size="24" font-weight="700">Evidence / User Artifacts</text><text x="1360" y="268" text-anchor="middle" fill="#cbd5e1" font-size="17">logs • screenshots • tool output</text>
</g>

