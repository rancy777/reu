<!-- Core -->
<g filter="url(#shadow)">
<rect x="430" y="400" width="740" height="190" rx="28" fill="url(#core)" opacity=".95"/>
<text x="800" y="450" text-anchor="middle" fill="white" font-size="31" font-family="Inter,Arial,sans-serif" font-weight="800">Reverse Engineering Agent Skill</text>
<text x="800" y="485" text-anchor="middle" fill="#dbeafe" font-size="18" font-family="Inter,Arial,sans-serif">Triage → Hypothesis → Workflow → Experiment → Validation</text>
<g fill="#eff6ff" font-family="Inter,Arial,sans-serif" font-size="16">
<text x="520" y="530">• Target / platform classification</text><text x="790" y="530">• Protector / obfuscator reasoning</text><text x="1040" y="530">• Failure diagnosis</text>
<text x="520" y="560">• Evidence &amp; provenance</text><text x="790" y="560">• Version-aware routing</text><text x="1040" y="560">• Safe tool selection</text>
</g>
</g>

<!-- Tool plane -->
<g filter="url(#shadow)">
<rect x="70" y="650" width="680" height="160" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
<text x="410" y="690" text-anchor="middle" fill="#7dd3fc" font-size="24" font-family="Inter,Arial,sans-serif" font-weight="700">MCP / Tool Plane</text>
<text x="105" y="730" fill="#cbd5e1" font-size="17" font-family="Inter,Arial,sans-serif">IDA • Ghidra • x64dbg • WinDbg • Binary Ninja</text>
<text x="105" y="758" fill="#cbd5e1" font-size="17" font-family="Inter,Arial,sans-serif">Frida • JADX • Apktool • Unidbg • radare2</text>
<text x="105" y="786" fill="#94a3b8" font-size="15" font-family="Inter,Arial,sans-serif">Provider discovery • capability mapping • health checks • side-effect gates</text>
</g>

<!-- Knowledge plane -->
<g filter="url(#shadow)">
<rect x="830" y="650" width="700" height="160" rx="24" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
<text x="1180" y="690" text-anchor="middle" fill="#6ee7b7" font-size="24" font-family="Inter,Arial,sans-serif" font-weight="700">Knowledge Plane</text>
<text x="865" y="730" fill="#cbd5e1" font-size="17" font-family="Inter,Arial,sans-serif">Protector Case Corpus • Runtime Compatibility Matrix</text>
<text x="865" y="758" fill="#cbd5e1" font-size="17" font-family="Inter,Arial,sans-serif">Evidence Graph • Regression Corpus • Provenance</text>
<text x="865" y="786" fill="#94a3b8" font-size="15" font-family="Inter,Arial,sans-serif">Observed facts are versioned; hypotheses remain hypotheses until validated</text>
</g>

<path d="M800 590 V640" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)"/>
<text x="800" y="635" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Inter,Arial,sans-serif">normalized observations</text>
