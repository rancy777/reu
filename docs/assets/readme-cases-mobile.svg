<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc">
<title id="title">Two measured VMProtect 3.8.4 x64 experiments</title>
<desc id="desc">Measured results for two separate owned C++ samples, recorded 2026-10-17. Packing reconstruction and one pure-function semantic recovery. Not general VMP coverage or a full-domain equivalence proof.</desc>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
<rect x="1" y="1" width="478" height="312" rx="14" fill="#ffffff" stroke="#d7deea"/>
<text x="29" y="39" fill="#d34a30" font-size="17" font-weight="700">01 / PACKING &amp; RECONSTRUCTION</text><text x="29" y="101" fill="#172238" font-size="42" font-weight="750">12.03 MiB → 5 KiB</text><text x="29" y="141" fill="#52617a" font-size="19" font-weight="400">Protected image → standalone reconstructed EXE</text><path d="M29 165h422" stroke="#d7deea"/>
<text x="29" y="203" fill="#172238" font-size="29" font-weight="700">45 / 45</text><text x="183" y="201" fill="#52617a" font-size="20" font-weight="400">behavior checks passed</text><text x="29" y="238" fill="#172238" font-size="29" font-weight="700">14 / 14</text><text x="183" y="236" fill="#52617a" font-size="20" font-weight="400">structural checks passed</text><text x="29" y="283" fill="#52617a" font-size="17" font-weight="400">Known OEP · 9 manual import-call repairs</text><rect x="1" y="346" width="478" height="312" rx="14" fill="#ffffff" stroke="#d7deea"/>
<text x="29" y="384" fill="#d34a30" font-size="17" font-weight="700">02 / FUNCTION VIRTUALIZATION</text><text x="29" y="446" fill="#172238" font-size="54" font-weight="750">53</text><text x="120" y="444" fill="#172238" font-size="22" font-weight="600">native x64 instructions</text><text x="29" y="486" fill="#52617a" font-size="19" font-weight="400">Real VM trace → Triton → LLVM → native DLL</text><path d="M29 510h422" stroke="#d7deea"/>
<text x="29" y="548" fill="#172238" font-size="29" font-weight="700">100,008</text><text x="183" y="546" fill="#52617a" font-size="20" font-weight="400">input checks passed</text><text x="29" y="583" fill="#172238" font-size="29" font-weight="700">128</text><text x="183" y="581" fill="#52617a" font-size="20" font-weight="400">protected comparisons passed</text><text x="29" y="628" fill="#52617a" font-size="17" font-weight="400">One pure function · CLI harness rebuilt separately</text>
